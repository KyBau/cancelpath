# Alternative: Fly.io (needs account + card on file). NOT deployed.
app = "cancelpath-mcp"
primary_region = "ord"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
